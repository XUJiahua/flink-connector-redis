---
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: "Build and Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure Redis password
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass test123

      - name: Build and test
        run: |
          mvn clean verify -Dgpg.skip=true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/*-jar-with-dependencies.jar
